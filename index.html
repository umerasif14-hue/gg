<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}body{background:#fff;color:#111}#home{height:100%;display:flex;align-items:center;justify-content:center}#wordmark{font-size:clamp(42px,8vw,76px);font-weight:500;letter-spacing:-3px;color:#111;user-select:none}#arcade{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#090d18}body.gaming{overflow:hidden}body.gaming #home{display:none}body.gaming #arcade{display:block}
</style>
</head>
<body>
<main id="home" aria-label="Canvas"><div id="wordmark">Canvas</div></main>
<iframe id="arcade" title="GG Gaming" src="arcade.html"></iframe>
<script>
let typed="",last=0;
document.addEventListener("keydown",function(e){
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const now=Date.now();
 if(now-last>1200)typed="";
 last=now;
 if(e.key.length===1)typed+=e.key.toLowerCase();
 typed=typed.slice(-2);
 if(typed==="gg"){document.body.classList.add("gaming");document.title="GG Arcade";typed="";}
 if(e.key==="Escape"&&document.body.classList.contains("gaming")){document.body.classList.remove("gaming");document.title="Canvas";}
});
</script>
</body>
</html>
