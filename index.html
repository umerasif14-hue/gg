<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d25">
<title>KCloud Login</title>
<style>
:root{color-scheme:dark;--navy:#080d25;--blue:#173b91;--purple:#8b5cf6;--green:#58e6a5;--muted:#aab4d1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;color:#f7f8ff;background:radial-gradient(ellipse at 15% 15%,rgba(35,91,205,.42),transparent 38%),radial-gradient(ellipse at 85% 18%,rgba(139,92,246,.35),transparent 34%),radial-gradient(ellipse at 72% 90%,rgba(47,204,139,.18),transparent 32%),linear-gradient(135deg,#070b20 0%,#101a42 52%,#0a102b 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(2px);opacity:.55}
body:before{width:340px;height:340px;left:-170px;bottom:-150px;border:1px solid rgba(88,230,165,.35);box-shadow:0 0 90px rgba(88,230,165,.15)}
body:after{width:440px;height:440px;right:-230px;top:35%;border:1px solid rgba(139,92,246,.35);box-shadow:0 0 110px rgba(139,92,246,.18)}
.topbar{height:78px;display:flex;align-items:center;padding:0 clamp(20px,5vw,68px);gap:13px;border-bottom:1px solid rgba(190,204,255,.12);background:rgba(7,12,34,.45);backdrop-filter:blur(18px);position:relative;z-index:1}
.logo{height:42px;width:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,#2878ed,#8b5cf6 70%,#58e6a5);box-shadow:0 8px 28px rgba(91,103,255,.35);font-size:21px;font-weight:850;color:white}
.brand{font-size:21px;font-weight:750;letter-spacing:.2px}.brand span{color:var(--green)}
.main{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:48px 18px;position:relative;z-index:1}
.card{width:min(440px,100%);padding:38px 38px 30px;border:1px solid rgba(198,209,255,.2);border-radius:25px;background:linear-gradient(145deg,rgba(24,36,80,.88),rgba(12,20,51,.91));box-shadow:0 28px 90px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(22px)}
.mark{width:58px;height:5px;border-radius:10px;margin:0 auto 25px;background:linear-gradient(90deg,#2878ed,#9b6bff,#58e6a5);box-shadow:0 0 20px rgba(139,92,246,.45)}
.heading{text-align:center;font-size:29px;letter-spacing:-.8px;font-weight:760;margin:0 0 9px}
.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 29px}
.field-label{display:block;font-size:13px;font-weight:650;color:#dce4ff;margin:18px 0 8px}
.field{width:100%;height:49px;border:1px solid rgba(176,193,255,.24);border-radius:12px;background:rgba(5,12,35,.62);padding:0 14px;font-size:15px;color:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:#7785ac}.field:focus{border-color:#8b75ff;box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.continue{display:block;width:100%;margin-top:27px;border:0;border-radius:12px;padding:14px;background:linear-gradient(100deg,#246fe6 0%,#8258ed 55%,#39c98f 130%);color:white;font-size:15px;font-weight:750;letter-spacing:.2px;cursor:pointer;box-shadow:0 10px 26px rgba(73,105,232,.3);transition:transform .2s,filter .2s,box-shadow .2s}
.continue:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 14px 32px rgba(73,105,232,.4)}
.continue:active{transform:translateY(0)}
.notice{display:none;margin-top:16px;padding:12px 13px;border-radius:11px;border:1px solid rgba(88,230,165,.3);background:rgba(43,180,126,.1);font-size:13px;line-height:1.5;color:#baf8dc}
.foot{text-align:center;color:#8996bb;font-size:11px;line-height:1.5;margin-top:25px}
@media(max-width:480px){.topbar{height:68px}.main{min-height:calc(100vh - 68px);padding:28px 16px}.card{padding:32px 23px 26px;border-radius:21px}.heading{font-size:26px}}
</style>
</head>
<body>
<header class="topbar"><div class="logo" aria-hidden="true">K</div><div class="brand">K<span>Cloud</span></div></header>
<main class="main">
<section class="card" aria-labelledby="heading">
<div class="mark" aria-hidden="true"></div>
<h1 class="heading" id="heading">Welcome back</h1>
<p class="sub">Sign in to continue to your KCloud space.</p>
<form id="portalForm">
<label class="field-label" for="user">Username</label>
<input class="field" id="user" name="user" autocomplete="off" placeholder="Enter username">
<label class="field-label" for="pass">Password</label>
<input class="field" id="pass" name="pass" type="password" autocomplete="off" placeholder="Enter password">
<button class="continue" type="submit">Continue</button>
</form>
<div id="notice" class="notice" role="status">This is a visual demo only. Sign-in is not connected; information entered here is not sent or saved.</div>
<div class="foot">KCloud independent demo · Not an official school or Canvas sign-in page</div>
</section>
</main>
<script>
document.getElementById("portalForm").addEventListener("submit",function(e){e.preventDefault();document.getElementById("notice").style.display="block";document.getElementById("pass").value=""});
let typed="",last=0;document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.matches("input,textarea,select"))return;const now=Date.now();if(now-last>1200)typed="";last=now;if(e.key.length===1)typed+=e.key.toLowerCase();typed=typed.slice(-2);if(typed==="gg"){location.href="arcade.html";typed=""}});
</script>
</body>
</html>
