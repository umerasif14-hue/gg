<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Portal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:#f5f6f8;color:#2d3b45}.topbar{height:68px;background:#fff;border-bottom:1px solid #d9dee3;display:flex;align-items:center;padding:0 30px;gap:12px}.logo{height:36px;width:36px;border-radius:50%;background:#b83a43;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}.brand{font-size:21px;font-weight:600;color:#2d3b45}.main{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:36px 18px}.card{width:min(430px,100%);background:#fff;border:1px solid #d9dee3;border-radius:4px;box-shadow:0 2px 6px #1d27330c;padding:34px 36px 30px}.heading{text-align:center;font-size:25px;font-weight:500;margin:0 0 8px}.sub{text-align:center;color:#64727d;font-size:14px;line-height:1.5;margin:0 0 26px}.field-label{display:block;font-size:14px;font-weight:600;margin:17px 0 7px}.field{width:100%;height:43px;border:1px solid #9aa5ae;border-radius:4px;background:#fff;padding:10px 12px;font-size:15px;color:#2d3b45}.field:focus{outline:2px solid #8dbde8;outline-offset:1px}.continue{display:block;width:100%;margin-top:24px;background:#b83a43;border:1px solid #a8333b;color:#fff;border-radius:4px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}.continue:hover{background:#a8333b}.small{text-align:center;font-size:12px;color:#64727d;margin:20px 0 0}.foot{text-align:center;color:#687781;font-size:12px;margin-top:22px}.notice{display:none;margin-top:14px;background:#fff7e6;border:1px solid #ead7a8;padding:10px;border-radius:4px;font-size:13px;color:#5c4b25}.help{color:#176b9a;text-decoration:none;font-size:13px}.help:hover{text-decoration:underline}@media(max-width:480px){.topbar{padding:0 18px}.card{padding:28px 22px}}
</style>
</head>
<body>
<header class="topbar"><div class="logo" aria-hidden="true">L</div><div class="brand">Learning Portal</div></header>
<main class="main"><section class="card" aria-labelledby="heading"><h1 class="heading" id="heading">Welcome</h1><p class="sub">Access your learning space and continue where you left off.</p>
<form id="portalForm">
<label class="field-label" for="user">Username</label><input class="field" id="user" name="user" autocomplete="off" placeholder="Enter username">
<label class="field-label" for="pass">Password</label><input class="field" id="pass" name="pass" type="password" autocomplete="off" placeholder="Enter password">
<button class="continue" type="submit">Sign in</button>
</form>
<div id="notice" class="notice" role="status">This is a visual demo page only. Sign-in is not connected, and anything typed here is not sent or saved.</div>
<p class="small"><a class="help" href="#" id="help">Need help signing in?</a></p><div class="foot">Independent demo portal · Not an official school or Canvas sign-in page</div></section></main>
<script>
document.getElementById("portalForm").addEventListener("submit",function(e){e.preventDefault();document.getElementById("notice").style.display="block";document.getElementById("pass").value=""});
document.getElementById("help").addEventListener("click",function(e){e.preventDefault();document.getElementById("notice").style.display="block"});
let typed="",last=0;document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.matches("input,textarea,select"))return;const now=Date.now();if(now-last>1200)typed="";last=now;if(e.key.length===1)typed+=e.key.toLowerCase();typed=typed.slice(-2);if(typed==="gg"){location.href="arcade.html";typed=""}});
</script>
</body></html>
